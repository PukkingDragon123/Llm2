name: Desktop app
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r desktop/requirements.txt
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-calc-nogui poppler-utils
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Backend tests
        id: tests
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cd backend && python -m pytest -q
      - name: Rendering diagnostics
        if: runner.os == 'Linux' && steps.tests.outcome == 'failure'
        run: |
          soffice --version; fc-match Cambria; fc-list | wc -l
          cd backend && python - <<'PY'
          import json, sys, subprocess
          sys.path.insert(0, ".")
          from app.calc.engine import compute
          from app.exports.quotation import build_quotation_workbook, xlsx_to_pdf
          d = json.load(open("app/seed/reference_import.json", encoding="utf-8"))
          r = compute(d["estimate"]); q = d["quote_doc"]; q["quotation_date"] = "2026-10-19"
          print(build_quotation_workbook(q, r, "/tmp/QT.xlsx")); pdf = xlsx_to_pdf("/tmp/QT.xlsx", "/tmp")
          print(subprocess.run(["pdffonts", pdf], capture_output=True, text=True).stdout)
          for p in range(1, 5):
              t = subprocess.run(["pdftotext", "-f", str(p), "-l", str(p), "-layout", pdf, "-"], capture_output=True, text=True).stdout.strip().splitlines()
              print(f"--- page {p}: {len(t)} lines"); print("\n".join(t))
          PY
      - name: PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build desktop/prolog_estimator.spec
      - name: Smoke test packaged app
        shell: bash
        timeout-minutes: 15
        run: |
          EXE=dist/PrologEstimator/PrologEstimator
          [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          export PROLOG_DATA_DIR="$RUNNER_TEMP/smoke" PROLOG_SMOKE_OUT="$RUNNER_TEMP/smoke.json"
          T=""; command -v timeout >/dev/null && T="timeout 600"
          set +e; $T "$EXE" --smoke-test; code=$?; set -e
          cat "$RUNNER_TEMP/smoke.json" 2>/dev/null; echo; tail -50 "$RUNNER_TEMP/smoke/app.log" 2>/dev/null || true
          exit $code
      - name: Windows installer
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" desktop\installer.iss
          Copy-Item desktop\Output\*.exe .
      - name: Package archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../PrologEstimator-windows-$APP_VERSION.zip PrologEstimator >/dev/null;
          else tar czf ../PrologEstimator-$(echo $RUNNER_OS | tr A-Z a-z)-$APP_VERSION.tar.gz PrologEstimator; fi
      - uses: actions/upload-artifact@v4
        with:
          name: PrologEstimator-${{ runner.os }}
          path: |
            PrologEstimator-*.zip
            PrologEstimator-*.tar.gz
            PrologEstimator-Setup-*.exe
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PrologEstimator-*.zip
            PrologEstimator-*.tar.gz
            PrologEstimator-Setup-*.exe
